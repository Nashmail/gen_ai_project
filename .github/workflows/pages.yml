# Publishes the frontend folder to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["nash-dhabha-and-bakes/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the frontend engine matches shared/engine.js
        run: cmp nash-dhabha-and-bakes/shared/engine.js nash-dhabha-and-bakes/frontend/js/engine.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nash-dhabha-and-bakes/frontend
      - id: deployment
        uses: actions/deploy-pages@v4
